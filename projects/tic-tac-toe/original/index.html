<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play with AI - Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Play with AI</h1>
    <h2>Tic-Tac-Toe</h2>
    <p class="subtitle">You are X. The AI is O.</p>

    <div class="scoreboard">
      <div class="score-card">
        <span>Player</span>
        <strong id="playerScore">0</strong>
      </div>
      <div class="score-card">
        <span>AI</span>
        <strong id="aiScore">0</strong>
      </div>
      <div class="score-card">
        <span>Draws</span>
        <strong id="drawScore">0</strong>
      </div>
    </div>

    <div id="status">Your turn</div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="buttons">
      <button id="restartBtn">Restart Round</button>
      <button id="resetScoreBtn">Reset Scores</button>
    </div>

    <div class="info-box">
      <h3>How it works</h3>
      <p>
        This is a JavaScript game where the player competes against an AI opponent.
        The AI automatically analyzes the board and chooses its next move.
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
